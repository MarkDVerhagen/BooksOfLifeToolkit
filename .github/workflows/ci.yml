name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Smoke test the end-to-end pipeline (synthetic data)
        run: |
          python synth/main.py
          python serialization/make_db.py --data_dir synth/data --yaml_file recipes/make_db --db_name db
          python main.py --db_path db.duckdb --recipe_path recipes/template --output_dir output
          test -s output/books.jsonl
